name: Deploy to Cloudways

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CLOUDWAYS_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.CLOUDWAYS_PORT }} ${{ secrets.CLOUDWAYS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy theme via rsync
        run: |
          rsync -rz --delete --omit-dir-times \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -p ${{ secrets.CLOUDWAYS_PORT }}" \
            ./ \
            "${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:${{ secrets.CLOUDWAYS_PATH }}/"

      - name: Install Composer dependencies
        run: |
          ssh -p ${{ secrets.CLOUDWAYS_PORT }} \
            "${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}" \
            "cd '${{ secrets.CLOUDWAYS_PATH }}' && composer install --no-dev --optimize-autoloader --no-interaction"